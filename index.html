<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Personal assistant: reminders, what to wear, and a chat that knows your home.">
  <title>Homebase</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Homebase</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      <span>Home</span></a>
    <a href="#chat" data-tab="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      <span>Chat</span></a>
    <a href="#wardrobe" data-tab="wardrobe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7a2.2 2.2 0 1 0-2.2-2.2"/><path d="M12 7v2l8.5 5.6a1.6 1.6 0 0 1-.9 2.9H4.4a1.6 1.6 0 0 1-.9-2.9L12 9"/></svg>
      <span>Wardrobe</span></a>
    <a href="#tasks" data-tab="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
      <span>Tasks</span></a>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="bootError" class="boot-error" hidden>
    <b>Homebase couldn't start.</b>
    <div id="bootMsg" class="small"></div>
    <button class="btn primary" id="bootReset" type="button">Reset app files &amp; reload</button>
    <div class="small">Your connection settings are kept.</div>
  </div>
  <script>
    // Shows startup errors on screen instead of a silent freeze.
    (function () {
      var errs = [];
      function show() {
        if (window.__hbBooted) return;
        document.getElementById('bootMsg').textContent = errs.length ? errs.slice(-2).join(' | ') : 'The app files did not load. Check your connection.';
        document.getElementById('bootError').hidden = false;
      }
      window.addEventListener('error', function (e) { errs.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : '')); if (!window.__hbBooted) show(); }, true);
      window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(show, 6000);
      document.getElementById('bootReset').onclick = function () {
        var p = [];
        if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        try { localStorage.removeItem('homebase.today'); } catch (e) {}
        Promise.all(p).finally(function () { location.replace(location.pathname + '?r=' + Date.now() + '#today'); });
      };
    })();
  </script>
  <script type="importmap">
  {"imports":{
    "onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.bundle.min.mjs",
    "onnxruntime-web/webgpu":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.webgpu.bundle.min.mjs"}}
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
